<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="lockScreen" class="lock-screen">
  <h2>Enter Our Special Date ❤️</h2>
  <input type="password" id="password" placeholder="DDMMYYYY">
  <button onclick="unlockSite()">Unlock</button>
</div>

<!-- MAIN CONTENT -->
<div id="mainContent" class="hidden">
  <audio autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <h1>Happy 3 Years ❤️</h1>

    <!-- LOVE LETTER -->
    <div class="section">
      <h2>For You 💌</h2>
      <p id="typewriter"></p>
    </div>

    <!-- MEMORIES -->
    <div class="section">
      <h2>Our Memories 📸</h2>
      <div class="gallery">
        <img src="img1.jpg">
        <img src="img2.jpg">
      </div>
    </div>

    <!-- BUTTON -->
    <div class="section">
      <button onclick="showMessage()">Tap Here ❤️</button>
      <p id="hiddenMessage" class="hidden">No matter the distance, it's always you ❤️</p>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
