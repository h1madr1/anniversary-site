<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Story ❤️</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- Floating Hearts -->
<div class="hearts"></div>

<!-- PASSWORD SCREEN -->
<div id="password-screen" class="screen active">
  <h2>Enter our special date ❤️</h2>
  <input type="password" id="passwordInput" placeholder="DDMMYYYY">
  <button onclick="checkPassword()">Unlock</button>
  <p id="error"></p>
</div>

<!-- ENTRY SCREEN -->
<div id="entry-screen" class="screen">
  <h2>I made something just for you...</h2>
  <button onclick="startExperience()">Tap to start our story ❤️</button>
</div>

<!-- MAIN CONTENT -->
<div id="main-content">

  <h1 class="main-title">Happy Anniversary Bouraniii ❤️🤗😘</h1>

  <!-- SECTION 1 -->
  <section class="fade">
    <img src="proposal.jpeg" class="full-img">
    <p>The moment everything changed...</p>
  </section>

  <!-- SECTION 2 -->
  <section class="fade">
    <h2>Something I Always Wanted to Tell You</h2>
    <button onclick="toggleLetter()">Open Letter 💌</button>
    <div id="letter">
      <img src="personal_msg.jpeg">
    </div>
  </section>

  <!-- SECTION 3 -->
  <section class="fade">
    <h2>Our Beautiful Memories</h2>
    <button onclick="toggleSlideshow()">See Our Moments ❤️</button>
    <div id="slideshow">
      <img id="slideImg" src="img1.jpeg" alt="Memory">
    </div>
  </section>

  <!-- SECTION 4 -->
  <section class="fade">
    <h2>Just One More Thing...</h2>
    <button onclick="showFinalMessage()">Read ❤️</button>
    <p id="finalText"></p>
  </section>

  </section>

</div>

<audio id="bg-music" src="music.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
